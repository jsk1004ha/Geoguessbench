[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoguessbench"
version = "0.1.0"
description = "Reproducible, server-scored visual geolocation and exploration benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<13", "pydantic>=2.8,<3", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
data = ["huggingface-hub>=0.25,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
geoguessbench = "geoguessbench.cli:main"

[tool.setuptools.packages.find]
include = ["geoguessbench*"]

[tool.setuptools.package-data]
geoguessbench = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
